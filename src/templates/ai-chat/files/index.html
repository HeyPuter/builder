<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
<script>
window.onerror=function(msg,src,line,col,err){window.parent.postMessage({type:'app-error',message:msg,source:src,lineno:line,colno:col,stack:err&&err.stack||''},'*');};
window.onunhandledrejection=function(e){window.parent.postMessage({type:'app-error',message:'Unhandled promise rejection: '+(e.reason&&e.reason.message||e.reason||'unknown'),stack:e.reason&&e.reason.stack||''},'*');};
window.addEventListener('error',function(e){var t=e&&e.target;if(t&&t!==window&&t.tagName==='SCRIPT'){var u=t.src||'';window.parent.postMessage({type:'app-error',message:'Failed to load script'+(u?': '+u:' (inline module)'),source:u},'*');}},true);
(function(){var _f=window.fetch;window.fetch=function(){var a=arguments,u=typeof a[0]==='string'?a[0]:(a[0]&&a[0].url)||'';var p=_f.apply(this,a);p.then(function(r){if(r.status===500){r.clone().text().then(function(b){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:b},'*');}).catch(function(){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:''},'*');});}}).catch(function(e){window.parent.postMessage({type:'fetch-error',url:u,status:0,body:e.message||'fetch failed'},'*');});return p;};})();
</script>
<script src="https://builder.puter.com/runtime.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>AI Chat</title>
<meta name="description" content="A private AI assistant that remembers your conversations.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://js.puter.com/v2/"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
</script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="h-full bg-white font-sans text-slate-900 antialiased">

<!-- Signed out -->
<section id="signed-out" class="hidden h-full items-center justify-center px-6">
    <div class="w-full max-w-sm text-center">
        <img src="icon.svg" alt="" class="mx-auto h-14 w-14">
        <h1 class="mt-5 text-2xl font-semibold">AI Chat</h1>
        <p class="mt-2 text-slate-600">A private assistant that remembers your conversations. Sign in with Puter to start chatting.</p>
        <button id="sign-in" class="mt-6 inline-flex w-full items-center justify-center gap-2 rounded-lg bg-violet-600 px-4 py-2.5 font-medium text-white hover:bg-violet-700">
            <i data-lucide="log-in" class="h-4 w-4"></i> Sign in with Puter
        </button>
        <p id="sign-in-error" class="mt-3 min-h-[1.25rem] text-sm text-red-600" role="alert"></p>
    </div>
</section>

<!-- Signed in -->
<div id="app" class="hidden h-full">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-30 flex w-72 -translate-x-full flex-col border-r border-slate-200 bg-slate-50 transition-transform md:static md:translate-x-0">
        <div class="flex items-center gap-2 p-4">
            <img src="icon.svg" alt="" class="h-7 w-7">
            <span class="flex-1 font-semibold">AI Chat</span>
            <button id="close-sidebar" class="rounded-lg p-1.5 text-slate-500 hover:bg-slate-200 md:hidden" aria-label="Close conversations">
                <i data-lucide="x" class="h-5 w-5"></i>
            </button>
        </div>
        <div class="px-3">
            <button id="new-chat" class="flex w-full items-center gap-2 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-medium hover:bg-slate-100">
                <i data-lucide="square-pen" class="h-4 w-4"></i> New chat
            </button>
        </div>
        <p class="px-4 pb-1 pt-5 text-xs font-semibold uppercase tracking-wide text-slate-400">Recent</p>
        <nav id="conversations" class="flex-1 space-y-0.5 overflow-y-auto px-2 pb-3" aria-label="Conversations"></nav>
        <div class="flex items-center gap-2 border-t border-slate-200 p-3 text-sm">
            <span class="flex h-8 w-8 items-center justify-center rounded-full bg-violet-100 font-semibold text-violet-700" id="avatar"></span>
            <span id="username" class="min-w-0 flex-1 truncate text-slate-700"></span>
            <button id="sign-out" class="rounded-lg p-1.5 text-slate-500 hover:bg-slate-200" title="Sign out" aria-label="Sign out">
                <i data-lucide="log-out" class="h-4 w-4"></i>
            </button>
        </div>
    </aside>
    <div id="scrim" class="fixed inset-0 z-20 hidden bg-slate-900/30 md:hidden"></div>

    <main class="flex h-full min-w-0 flex-1 flex-col">
        <header class="flex items-center gap-2 border-b border-slate-200 px-4 py-3">
            <button id="open-sidebar" class="rounded-lg p-1.5 text-slate-600 hover:bg-slate-100 md:hidden" aria-label="Open conversations">
                <i data-lucide="panel-left" class="h-5 w-5"></i>
            </button>
            <h2 id="chat-title" class="min-w-0 flex-1 truncate font-medium">New chat</h2>
        </header>

        <div id="scroller" class="flex-1 overflow-y-auto">
            <div id="empty" class="mx-auto flex h-full max-w-2xl flex-col items-center justify-center px-6 text-center">
                <span class="flex h-12 w-12 items-center justify-center rounded-xl bg-violet-100 text-violet-700"><i data-lucide="sparkles" class="h-6 w-6"></i></span>
                <h3 class="mt-4 text-xl font-semibold">How can I help today?</h3>
                <div id="starters" class="mt-6 grid w-full gap-2 sm:grid-cols-2"></div>
            </div>
            <div id="messages" class="mx-auto hidden max-w-2xl space-y-6 px-4 py-6"></div>
        </div>

        <form id="composer" class="mx-auto w-full max-w-2xl px-4 pb-4">
            <div class="flex items-end gap-2 rounded-2xl border border-slate-300 bg-white p-2 focus-within:border-violet-500 focus-within:ring-2 focus-within:ring-violet-100">
                <label for="prompt" class="sr-only">Message</label>
                <textarea id="prompt" rows="1" placeholder="Message AI Chat" class="max-h-48 flex-1 resize-none bg-transparent px-2 py-1.5 focus:outline-none"></textarea>
                <button id="send" type="submit" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-violet-600 text-white hover:bg-violet-700 disabled:opacity-40" aria-label="Send message" disabled>
                    <i data-lucide="arrow-up" class="h-5 w-5"></i>
                </button>
            </div>
            <p class="mt-2 text-center text-xs text-slate-400">AI can make mistakes. Check important information.</p>
        </form>
    </main>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
