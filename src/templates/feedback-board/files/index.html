<!DOCTYPE html>
<html lang="en">
<head>
<script>
window.onerror=function(msg,src,line,col,err){window.parent.postMessage({type:'app-error',message:msg,source:src,lineno:line,colno:col,stack:err&&err.stack||''},'*');};
window.onunhandledrejection=function(e){window.parent.postMessage({type:'app-error',message:'Unhandled promise rejection: '+(e.reason&&e.reason.message||e.reason||'unknown'),stack:e.reason&&e.reason.stack||''},'*');};
window.addEventListener('error',function(e){var t=e&&e.target;if(t&&t!==window&&t.tagName==='SCRIPT'){var u=t.src||'';window.parent.postMessage({type:'app-error',message:'Failed to load script'+(u?': '+u:' (inline module)'),source:u},'*');}},true);
(function(){var _f=window.fetch;window.fetch=function(){var a=arguments,u=typeof a[0]==='string'?a[0]:(a[0]&&a[0].url)||'';var p=_f.apply(this,a);p.then(function(r){if(r.status===500){r.clone().text().then(function(b){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:b},'*');}).catch(function(){window.parent.postMessage({type:'fetch-error',url:u,status:500,body:''},'*');});}}).catch(function(e){window.parent.postMessage({type:'fetch-error',url:u,status:0,body:e.message||'fetch failed'},'*');});return p;};})();
</script>
<script src="https://builder.puter.com/runtime.js" defer></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Feedback Board</title>
<meta name="description" content="Share an idea, upvote the ones you want most, and see what matters to everyone.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
</script>
</head>
<body class="min-h-screen bg-slate-50 font-sans text-slate-900 antialiased">

<header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-5 py-4">
        <img src="icon.svg" alt="" class="h-8 w-8">
        <div class="flex-1">
            <h1 class="text-lg font-semibold leading-tight">Feedback Board</h1>
            <p class="text-sm text-slate-500">Share ideas and vote for what should happen next.</p>
        </div>
        <button id="new-idea" class="inline-flex items-center gap-2 rounded-lg bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800">
            <i data-lucide="plus" class="h-4 w-4"></i><span class="hidden sm:inline">New idea</span>
        </button>
    </div>
</header>

<main class="mx-auto max-w-3xl px-5 py-6">
    <form id="idea-form" class="mb-6 hidden rounded-xl border border-slate-200 bg-white p-5" novalidate>
        <label for="idea-title" class="block text-sm font-medium text-slate-700">Your idea</label>
        <input id="idea-title" maxlength="100" required placeholder="A short, clear title" class="mt-1.5 w-full rounded-lg border border-slate-300 px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-100">
        <label for="idea-details" class="mt-4 block text-sm font-medium text-slate-700">Details <span class="font-normal text-slate-400">(optional)</span></label>
        <textarea id="idea-details" maxlength="500" rows="3" placeholder="Why would this help? Who is it for?" class="mt-1.5 w-full resize-y rounded-lg border border-slate-300 px-3 py-2 focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-100"></textarea>
        <div class="mt-4 flex items-center justify-between gap-3">
            <p id="form-error" class="text-sm text-red-600" role="alert"></p>
            <div class="flex gap-2">
                <button type="button" id="cancel-idea" class="rounded-lg px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100">Cancel</button>
                <button type="submit" id="submit-idea" class="rounded-lg bg-teal-700 px-4 py-2 text-sm font-medium text-white hover:bg-teal-800 disabled:opacity-60">Post idea</button>
            </div>
        </div>
    </form>

    <div class="mb-4 flex items-center justify-between gap-3">
        <div class="inline-flex rounded-lg border border-slate-200 bg-white p-1 text-sm" role="tablist" aria-label="Sort ideas">
            <button type="button" role="tab" data-sort="top" class="sort-btn rounded-md px-3 py-1.5 font-medium">Top</button>
            <button type="button" role="tab" data-sort="new" class="sort-btn rounded-md px-3 py-1.5 font-medium">Newest</button>
        </div>
        <div class="relative w-full max-w-xs">
            <i data-lucide="search" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"></i>
            <label for="search" class="sr-only">Search ideas</label>
            <input id="search" type="search" placeholder="Search ideas" class="w-full rounded-lg border border-slate-200 bg-white py-2 pl-9 pr-3 text-sm focus:border-teal-600 focus:outline-none focus:ring-2 focus:ring-teal-100">
        </div>
    </div>

    <p id="summary" class="mb-3 text-sm text-slate-500" aria-live="polite"></p>
    <ul id="ideas" class="space-y-3"></ul>

    <div id="state" class="hidden rounded-xl border border-dashed border-slate-300 bg-white px-6 py-12 text-center">
        <i id="state-icon" data-lucide="lightbulb" class="mx-auto h-8 w-8 text-slate-400"></i>
        <p id="state-title" class="mt-3 font-medium"></p>
        <p id="state-body" class="mt-1 text-sm text-slate-500"></p>
        <button id="state-action" class="mt-4 hidden rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50"></button>
    </div>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
