    <!-- Resolve the colour theme BEFORE first paint so the cloak below (and every
         themed surface) paints in the right palette with no light→dark flash.
         Start with the OS preference while auth is unknown. The theme runtime
         in js/ui.js restores a saved choice only after a real user signs in
         and follows system changes while signed out. -->
    <script>
      (function () {
        try {
          var theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#171c24' : '#f5f5f5');
        } catch (e) { /* default (light) styling applies */ }
      })();
    </script>
    <!-- Anti-flicker cloak: paint a matching background immediately and keep the
         UI invisible until app.js confirms the first-paint fonts + the logo have
         loaded, then fade in (see revealWhenReady() in js/app.js). The inline
         failsafe guarantees the page is never left blank if app JS fails to run. -->
    <style>
      html { background-color: #f5f5f5; }
      html[data-theme="dark"] { background-color: #171c24; }
      body { opacity: 0; transition: opacity 0.2s ease; }
      html.app-ready body { opacity: 1; }
    </style>
    <script>setTimeout(function(){document.documentElement.classList.add('app-ready');},3000);</script>
