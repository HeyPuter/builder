<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../src/vendor/google-fonts.css">
<style>
  /* OPTION 3 — Pure typography, dark */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Roboto', sans-serif;
    background: #12161d;
    color: #e7e9ec;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .brand { position: absolute; top: 60px; left: 88px; display: flex; align-items: center; gap: 14px; }
  .brand .mark { width: 46px; height: 46px; border-radius: 11px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.07); }
  .brand .mark img { width: 100%; height: 100%; display: block; }
  .brand .name { font-size: 19px; font-weight: 700; }
  .brand .byline { font-size: 14px; color: #8b94a0; margin-top: 1px; }

  .headline {
    position: absolute; left: 88px; top: 208px;
    font-size: 84px; line-height: 1.08; font-weight: 700; letter-spacing: -0.025em;
  }
  .headline .ai { color: #6cb0f5; }
  .sub {
    position: absolute; left: 88px; top: 424px;
    font-size: 24px; font-weight: 300; color: #8b94a0; letter-spacing: 0.005em;
  }
  .url { position: absolute; left: 88px; bottom: 58px; font-size: 19px; font-weight: 500; color: #6cb0f5; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="brand">
    <div class="mark"><img src="../../icon.png" alt=""></div>
    <div>
      <div class="name">AI Builder</div>
      <div class="byline">by Puter</div>
    </div>
  </div>

  <div class="headline">Build apps &amp;<br>websites <span class="ai">with AI.</span></div>
  <div class="sub">No code. Free. In your browser.</div>
  <div class="url">builder.puter.com</div>
</body>
</html>
