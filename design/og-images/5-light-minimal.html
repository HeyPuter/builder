<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../src/vendor/google-fonts.css">
<style>
  /* OPTION 5 — Light minimal */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Roboto', sans-serif;
    background: #ffffff;
    color: #171c24;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .frame { position: absolute; inset: 26px; border: 1px solid #e7e9ee; border-radius: 18px; }
  .brand { position: absolute; top: 84px; left: 96px; display: flex; align-items: center; gap: 14px; }
  .brand .mark { width: 46px; height: 46px; border-radius: 11px; overflow: hidden; box-shadow: 0 2px 10px rgba(23,28,36,.14); }
  .brand .mark img { width: 100%; height: 100%; display: block; }
  .brand .name { font-size: 19px; font-weight: 700; }
  .brand .byline { font-size: 14px; color: #8b94a0; margin-top: 1px; }

  .headline {
    position: absolute; left: 96px; top: 218px;
    font-size: 78px; line-height: 1.1; font-weight: 700; letter-spacing: -0.025em;
    color: #171c24;
  }
  .headline .ai { color: #3d87e6; }
  .sub {
    position: absolute; left: 96px; top: 422px;
    font-size: 23px; font-weight: 400; color: #5f6675;
  }
  .url { position: absolute; left: 96px; bottom: 84px; font-size: 19px; font-weight: 500; color: #3d87e6; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="brand">
    <div class="mark"><img src="../../icon.png" alt=""></div>
    <div>
      <div class="name">AI Builder</div>
      <div class="byline">by Puter</div>
    </div>
  </div>

  <div class="headline">Build apps &amp; websites<br><span class="ai">with AI.</span></div>
  <div class="sub">Describe your idea. No code required.</div>
  <div class="url">builder.puter.com</div>
</body>
</html>
